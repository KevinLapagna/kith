<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t("login.title") }}</title>
  <link rel="stylesheet" href="/static/css/kith.css?v={{ asset_v() }}">
</head>
<body>
  <main class="wrap login">
    <a class="wordmark" href="/">{{ t("brand.name") }}<span class="dot">.</span></a>
    <h1>{{ t("login.sign_in") }}</h1>
    <p class="muted small">{{ t("login.lede") }}</p>

    {% if error %}<p class="notice err">{{ error }}</p>{% endif %}

    <form class="card" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <div class="field">
        <label for="password">{{ t("login.password") }}</label>
        <input id="password" name="password" type="password" required autocomplete="current-password"
               autofocus>
      </div>
      <button class="btn primary" type="submit">{{ t("login.sign_in") }}</button>
    </form>

    <p class="muted small">
      {{ t("login.locked_out") }}
      <span class="mono">{{ t("login.command") }}</span>{{ t("login.locked_out_tail") }}
    </p>
  </main>
</body>
</html>
